# Railway service configuration for the server in this monorepo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/server/Dockerfile"
watchPatterns = ["/apps/server/**", "/package.json", "/bun.lock", "/bunfig.toml", "/railway.toml"]

[deploy]
startCommand = "node apps/server/dist/src/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
