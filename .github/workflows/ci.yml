name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: check
            command: vp check
          - task: test-mobile
            command: bun --cwd=apps/mobile run test --ci --cacheDirectory=../../.cache/jest
          - task: test-server
            command: bun run test:server
          - task: build-mobile
            # Export directly so CI does not run the native-generation prebuild script.
            command: bun --cwd=apps/mobile run expo export --platform all
          - task: build-server
            command: bun --cwd=apps/server run build
          - task: build-landing
            command: bun --cwd=apps/landing run build
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: vp install --frozen-lockfile
      - run: vp run --filter=@lumina/i18n compile
      - name: Restore Jest transforms
        if: matrix.task == 'test-mobile'
        uses: actions/cache@v4
        with:
          path: .cache/jest
          key: ${{ runner.os }}-jest-v1-${{ hashFiles('bun.lock', 'apps/mobile/babel.config.*', 'apps/mobile/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-v1-${{ hashFiles('bun.lock', 'apps/mobile/babel.config.*', 'apps/mobile/package.json') }}-
      - name: Restore Next.js build cache
        if: matrix.task == 'build-landing'
        uses: actions/cache@v4
        with:
          path: apps/landing/.next/cache
          key: ${{ runner.os }}-next-v1-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-v1-${{ hashFiles('bun.lock') }}-
      - name: Run ${{ matrix.task }}
        run: ${{ matrix.command }}

  # Preserve the existing required check; skipped/failed matrix jobs cannot pass it.
  quality:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = "success"
